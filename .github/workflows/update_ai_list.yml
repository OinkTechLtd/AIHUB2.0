name: Update AI Tools & Startups List

on:
  schedule:
    # Runs at 08:00 and 20:00 UTC every single day
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # optional, improves build speeds

      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Crawler Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Optional if search API is guarded
        run: python update_ai_list.py

      - name: Commit and Push Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tools.json public/startups.json
          
          # Only commit if changes are detected
          if git diff --staged --quiet; then
            echo "No changes found in the AI database. Skipping commit."
          else
            git commit -m "chore(data): automated AI HUB 2.0 crawler update [skip ci]"
            git push origin HEAD
          fi
