name: AIHUB2.0 - Update AI Tools

on:
  # 1. Автоматически: каждые 6 часов (Google лимит ~100 запросов/день)
  schedule:
    - cron: '0 */6 * * *'
  
  # 2. Ручной запуск из вкладки Actions
  workflow_dispatch:
  
  # 3. При пуше в эту папку с workflow
  push:
    paths:
      - '.github/workflows/update_ai.yml'
      - 'update_ai_list.py'

jobs:
  update-ai-list:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4
      
      - name: 🐍 Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 📦 Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install googlesearch-python
          pip install beautifulsoup4
          pip install requests
      
      - name: 🤖 Запуск поискового робота
        run: python update_ai_list.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 💾 Коммит и пуш обновлений
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add tools.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update AI tools list [skip ci]"
          git push
